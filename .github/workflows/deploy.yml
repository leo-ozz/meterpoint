name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/meterpoint-producer

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Gate: nothing below runs if tests fail.
      - name: Build and test
        working-directory: services/producer
        run: ./gradlew build --no-daemon

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/producer
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Generate CI-owned env file
        run: |
          cat > deploy/.env.ci <<EOF
          PRODUCER_IMAGE=${{ env.IMAGE }}:${{ github.sha }}
          EOF

      - name: Sync deploy config
        run: |
          rsync -az --delete \
            deploy/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/meterpoint/"

      - name: Deploy
        run: |
          ssh -o BatchMode=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash -euo pipefail -s' <<'REMOTE'
          cd ~/meterpoint

          SERVER_ENV="$HOME/.meterpoint.env"
          test -f "$SERVER_ENV" || { echo "server env file missing: $SERVER_ENV" >&2; exit 1; }
          test -f .env.ci      || { echo ".env.ci was not synced" >&2; exit 1; }

          export COMPOSE_ENV_FILES="$SERVER_ENV,$PWD/.env.ci"

          docker compose pull
          docker compose up -d --remove-orphans
          REMOTE

      - name: Wait for healthy
        run: |
          ssh -o BatchMode=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'bash -euo pipefail -s' <<'REMOTE'
          cd ~/meterpoint
          export COMPOSE_ENV_FILES="$HOME/.meterpoint.env,$PWD/.env.ci"

          cid="$(docker compose ps -q producer)"
          test -n "$cid" || { echo "producer container not running" >&2; exit 1; }

          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$cid")"
            case "$status" in
              healthy)   echo "producer healthy"; exit 0 ;;
              unhealthy) echo "producer unhealthy" >&2; docker compose logs --tail=100 producer >&2; exit 1 ;;
            esac
            sleep 5
          done

          echo "timed out waiting for producer health" >&2
          docker compose logs --tail=100 producer >&2
          exit 1
          REMOTE
